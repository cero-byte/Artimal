<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artimal</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #07080d; color: #f5ead5; }
    main { width: min(560px, calc(100% - 48px)); text-align: center; }
    h1 { font: 400 64px/1 Georgia, serif; margin: 0 0 16px; }
    p { color: #aaa5a0; line-height: 1.6; }
    nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
    a { padding: 18px; border: 1px solid #806f57; border-radius: 12px; color: #f5ead5; text-decoration: none; }
    a:hover { background: #17151a; }
  </style>
</head>
<body>
  <main>
    <h1>artimal</h1>
    <p>请选择语言 / Choose a language</p>
    <nav><a href="zh/">中文</a><a href="en/">English</a></nav>
  </main>
</body>
</html>
